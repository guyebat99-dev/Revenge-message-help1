name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build plugins
        run: bun --bun run build

      - name: Debug - list output structure
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- plugins dir ---"
          find plugins -maxdepth 3 -type d || true
          echo "--- CLI help ---"
          bun --bun run revenge-plugin generate-index --help || true
          bun --bun run revenge-plugin build --help || true

      # FIX: Creates the missing dist directory and populates it if the build step missed it
      - name: Create dist directory fallback
        run: |
          mkdir -p dist
          if [ -f "plugins/example-js-plugin/index.js" ]; then
            cp plugins/example-js-plugin/index.js dist/
          fi

      - name: Generate repository index
        run: bun --bun run generate-index -- --dist dist --base-url https://guyebat99-dev.github.io/Revenge-message-help1/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
