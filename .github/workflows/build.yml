name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build plugins
        run: bun --bun run build

      - name: Collect dist
        run: |
          mkdir -p dist
          for plugin in plugins/*/; do
            name=$(basename "$plugin")
            mkdir -p "dist/$name"
            cp "$plugin/manifest.json" "dist/$name/manifest.json"
            cp "$plugin/build/js/index.js" "dist/$name/index.js"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4